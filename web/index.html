<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MIFI Custom — Login</title>
  <link rel="stylesheet" type="text/css" href="css/layer.css" />
  <link rel="stylesheet" type="text/css" href="css/restu-v6.css" />
  <script src="./js/plugins/jquery.js" type="text/javascript"></script>
  <script src="./js/utils/ajax.js" type="text/javascript"></script>
  <script src="./js/plugins/json2.js" type="text/javascript"></script>
  <script src="./js/plugins/layer.js" type="text/javascript"></script>
  <script src="./js/utils/alert.js" type="text/javascript"></script>
  <script src="./js/plugins/jquerysession.js" type="text/javascript"></script>
  <script src="./js/utils/cookiesHandler.js" type="text/javascript"></script>
  <script src="./js/utils/jsonHandler.js" type="text/javascript"></script>
  <style>
    body { margin: 0; }
    .login-shell { max-width: 420px; margin: 0 auto; padding: 60px 20px 30px; }
    .login-logo {
      text-align: center;
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic; font-weight: bold;
      font-size: 46px; color: #16213e; letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .login-logo .lc { color: var(--green); }
    .login-tag {
      text-align: center; margin-bottom: 28px;
    }
    .login-tag .brand-badge { margin: 0; }
    .login-card {
      background: #fff; border-radius: 16px; padding: 30px 30px 24px;
      box-shadow: 0 10px 40px rgba(50, 80, 20, 0.14);
    }
    .login-card h1 {
      font-size: 17px; color: #3a5a1e; margin: 0 0 18px; text-align: center;
      font-weight: 600;
    }
    .field { margin-bottom: 14px; }
    .field label {
      display: block; font-size: 12px; color: var(--muted);
      text-transform: uppercase; letter-spacing: .5px; margin-bottom: 5px;
    }
    .field input { width: 100%; box-sizing: border-box; }
    .login-actions { text-align: center; margin-top: 20px; }
    .login-actions input { margin: 0 5px; }
    select#select {
      position: absolute; top: 12px; right: 14px; z-index: 5;
    }
  </style>
</head>

<body class="login-body">
  <select id="select" name="select">
    <option id="en" value="0" selected="selected">English</option>
    <option id="zh" value="1">Chinese</option>
  </select>

  <div class="login-shell">
    <div class="login-logo">MIFI&nbsp;<span class="lc">Custom</span></div>
    <div class="login-tag"><span class="brand-badge">by @restuhaqza</span></div>

    <div class="login-card">
      <h1 lang="Sign in to your modem">Sign in to your modem</h1>
      <form name="gotomain" action="main.html" method="post">
        <table id="frm" border="0" style="width:100%; border-collapse:collapse;">
          <tbody>
            <tr>
              <td colspan="2" class="field">
                <label for="username" lang="Username:">Username:</label>
                <input type="text" name="username" id="username" autocomplete="username">
              </td>
            </tr>
            <tr>
              <td colspan="2" class="field">
                <label for="password" lang="Password:">Password:</label>
                <input type="password" name="password" id="password" autocomplete="current-password">
              </td>
            </tr>
            <tr>
              <td colspan="2" class="login-actions">
                <input class="btn btn-primary" id="login" type="button" value="Login" lang="Login"/>&nbsp;
                <input type="reset" value="Reset" lang="Reset"/>
              </td>
            </tr>
          </tbody>
        </table>
      </form>
    </div>

    <div class="login-sub" lang="Copyright &copy; 2021-2023 All rights reserved.">Copyright &copy; 2021-2023 All rights reserved.</div>
  </div>
</body>
<script src="./js/index.js" type="text/javascript"></script>
</html>
